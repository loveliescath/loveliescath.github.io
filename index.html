<!-- Background stars -->

<div class="stars">
    <span>✦</span>
    <span>·</span>
    <span>✧</span>
    <span>·</span>
    <span>✦</span>
    <span>·</span>

</div>


<!-- Floating hearts -->

<div class="heart heart-1">♥</div>
<div class="heart heart-2">♥</div>
<div class="heart heart-3">♥</div>
<div class="heart heart-4">♥</div>


<!-- Opening text -->

<main class="opening">

    <h1>
        You’re the hydrangea my heart
        <br>
        keeps blooming for, Sea.
    </h1>

    <div class="button-area">
        <button id="startButton">
            Click Here!
        </button>
    </div>

</main>


<!-- Hydrangea garden -->

<section class="garden">

    <div class="hydrangea small left">
        <div class="flower-head"></div>
        <div class="stem"></div>
    </div>


    <div class="hydrangea main">

        <div class="flower-head"></div>

        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>

        <div class="stem"></div>

    </div>


    <div class="hydrangea small right">

        <div class="flower-head"></div>

        <div class="stem"></div>

    </div>

</section>


<script src="script.js"></script>
