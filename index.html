<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday ♡</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #eaf6ff,
                #cce9ff,
                #dff3ff
            );

            font-family: Georgia, serif;
            position: relative;
        }

        .container {
            text-align: center;
            z-index: 10;
            animation: appear 2s ease;
        }

        h1 {
            color: #3979a8;
            font-size: 55px;
            letter-spacing: 8px;
            margin-bottom: 15px;

            text-shadow:
                0 3px 10px rgba(60, 130, 180, 0.2);
        }

        h2 {
            color: #629ac2;
            font-size: 30px;
            margin-bottom: 40px;
        }

        button {
            background: #6faed6;
            color: white;

            border: none;
            padding: 15px 38px;

            border-radius: 30px;
            font-size: 18px;

            cursor: pointer;

            box-shadow: 0 6px 20px rgba(80, 140, 190, 0.25);

            transition: 0.3s;
        }

        button:hover {
            background: #4f91bf;
            transform: scale(1.08);
        }

        /* BUNGA */

        .flower {
            position: absolute;
            font-size: 45px;
            animation: floating 5s ease-in-out infinite;
            opacity: 0.85;
        }

        .flower1 {
            left: 8%;
            top: 15%;
        }

        .flower2 {
            right: 10%;
            top: 12%;
            animation-delay: 1s;
        }

        .flower3 {
            left: 15%;
            bottom: 12%;
            animation-delay: 2s;
        }

        .flower4 {
            right: 15%;
            bottom: 15%;
            animation-delay: 3s;
        }

        .flower5 {
            left: 45%;
            top: 8%;
            font-size: 35px;
            animation-delay: 1.5s;
        }

        .flower6 {
            right: 40%;
            bottom: 8%;
            font-size: 35px;
            animation-delay: 2.5s;
        }

        /* BINTANG */

        .sparkle {
            position: absolute;
            color: #ffffff;
            font-size: 25px;
            animation: sparkle 2s infinite alternate;
        }

        .s1 {
            left: 25%;
            top: 20%;
        }

        .s2 {
            right: 25%;
            top: 25%;
            animation-delay: 1s;
        }

        .s3 {
            left: 30%;
            bottom: 25%;
            animation-delay: 1.5s;
        }

        .s4 {
            right: 30%;
            bottom: 20%;
            animation-delay: 2s;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        @keyframes sparkle {
            from {
                opacity: 0.3;
                transform: scale(0.8);
            }

            to {
                opacity: 1;
                transform: scale(1.2);
            }
        }

    </style>
</head>

<body>

    <!-- BUNGA -->

    <div class="flower flower1">🌼</div>
    <div class="flower flower2">🌸</div>
    <div class="flower flower3">🌷</div>
    <div class="flower flower4">🪻</div>
    <div class="flower flower5">🌼</div>
    <div class="flower flower6">🌸</div>

    <!-- SPARKLE -->

    <div class="sparkle s1">✦</div>
    <div class="sparkle s2">✧</div>
    <div class="sparkle s3">✦</div>
    <div class="sparkle s4">✧</div>


    <!-- TULISAN -->

    <div class="container">

        <h1>HAPPY BIRTHDAY</h1>

        <h2>Someone Special ♡</h2>

        <button onclick="openBirthday()">
            Click Here!
        </button>

    </div>


    <script>

        function openBirthday() {

            alert("Happy Birthday! ♡");

        }

    </script>

</body>
</html>
